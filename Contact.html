</head>

<body>
    <nav>
        <div class="logo">Iphone Store</div>
        <ul class="nav-links">
            <li> <a href="index.html">Home</a></li>
            <li> <a href="shop.html">Shop</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Signup</a></li>

            <li><a href="Contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="contact-container">
        <h1>Contact us</h1>
        <p>Contact us if there is any problem with you</p>
        <p>Our Email: <span class="email">IphoneStore.eg@gmail.com</span></p>
        <form id="contactForm" onsubmit="handleContact(event)">
            <label for="cname">Name:</label>
            <input type="text" id="cname" required placeholder="Your name">
            <label for="cemail">Email:</label>
            <input type="email" id="cemail" required placeholder="Your email">

            <label for="cmessage">Message:</label>
            <textarea id="cmessage" required placeholder="How can we help you?"></textarea>

            <button type="submit" onclick="alert('Your problem submited succefuly')">Send Message!</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 Iphone shop. All rights reserved.</p>
    </footer>
