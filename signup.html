<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="mainn.css">
    <link rel="stylesheet" href="indexx.css">
</head>

<body>
    <nav>
        <div class="logo">Iphone Store</div>
        <ul class="nav-links">
            <li> <a href="main.html">Home</a></li>
            <li> <a href="shop.html">Shop</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Signup</a></li>
            <li id="nav-profile" style="display:none;"><a href="profile.html">Profile</a></li>
            <li id="nav-logout" style="display:none;"><a href="#" onclick="logout()">Logout</a></li>
            <li><a href="Contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="form-container">
        <form id="loginForm" onsubmit="handlesignup(event)">
            <h1>Signup</h1>
            <h2>Create Account</h2>
            <label for="username">Username:</label>
            <input type="text" id="username" required placeholder="choose username">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Your email address">

            <label for="password">Password:</label>
            <input type="password" id="password" required placeholder="Choose a password">

            <button type="submit">Sign Up</button>
            <p>Already have an account? <a href="login.html">Login here</a></p>
            <footer>
                <p>&copy; 2026 Iphone Shop. All rights reserved.</p>
            </footer>
</body>

</html>
