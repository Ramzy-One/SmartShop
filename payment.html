<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mainn.css">
    <link rel="stylesheet" href="payment.css">
</head>

<body>

    <nav>
        <div class="logo">Iphone Store
            <img src="apple logo.png" alt="img logo">
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Signup</a></li>
            <li><a href="Contact.html">Contact</a></li>
        </ul>

        <button id="theme-toggle" class="theme-toggle" type="button">
            Light Mode
        </button>
    </nav>

    <div class="payment-container">

        <h1>Credit Card Payment</h1>

        <form>

            <label>Card Holder Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Card Number</label>
            <input type="text" placeholder="1111 2222 3333 4444" maxlength="19" required>

            <div class="card-row">

                <div class="input-group">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="MM/YY" required>
                </div>

                <div class="input-group">
                    <label>CVV</label>
                    <input type="password" placeholder="123" maxlength="3" required>
                </div>

            </div>

            <label>Email Address</label>
            <input type="email" placeholder="example@gmail.com" required>

            <label>Billing Address</label>
            <input type="text" placeholder="Your Address" required>

            <button type="submit" class="pay-button">
                Pay Now
            </button>

        </form>

    </div>

    <footer>
        <p>&copy; 2026 Iphone Shop. All rights reserved.</p>
    </footer>

</body>

</html>
